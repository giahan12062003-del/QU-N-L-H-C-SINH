<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ Thống Quản Lý Học Sinh</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <style>
        :root { --bg-cream: #faf8f5; --pastel-blue-dark: #0284c7; --pastel-purple-dark: #7e22ce; --card-bg: #ffffff; --border-radius: 16px; --shadow-soft: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-cream); padding: 16px; }
        .container { width: 100%; max-width: 1100px; margin: 0 auto; }
        .card { background: var(--card-bg); border-radius: var(--border-radius); padding: 18px; box-shadow: var(--shadow-soft); border: 1px solid #e2e8f0; margin-bottom: 20px; }
        .hidden { display: none !important; }
        .btn-primary { padding: 10px 16px; background: #0284c7; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; margin-top: 5px; }
        /* Style cho bộ ảnh */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
        .gallery-img { width: 100%; height: 200px; object-fit: cover; border-radius: 12px; border: 2px solid #e2e8f0; }
    </style>
</head>
<body>

    <!-- [NỘI DUNG NGUYÊN BẢN CỦA CÔ] -->
    <div id="report-view" class="container hidden">
        <!-- ... Các phần cũ ... -->
        
        <!-- THÊM VỊ TRÍ HIỂN THỊ ẢNH -->
        <div class="card">
            <h3 style="color: var(--pastel-blue-dark);">📸 Hoạt động của lớp</h3>
            <div id="gallery-container" class="gallery-grid">
                <p>Đang tải ảnh...</p>
            </div>
        </div>
    </div>

    <!-- THÊM VỊ TRÍ ADMIN TRONG TAB 3 -->
    <div id="admin-tab-students" class="hidden">
        <!-- ... Các phần quản lý học sinh cũ ... -->
        
        <div class="card">
            <h3 style="color: var(--pastel-blue-dark);">🖼️ Cập Nhật Bộ Ảnh Hoạt Động (Dán link ảnh, cách nhau bởi dấu phẩy)</h3>
            <textarea id="admin-gallery-urls" class="form-control" placeholder="Ví dụ: link1.jpg, link2.jpg..."></textarea>
            <button class="btn-primary" style="margin-top: 10px;" onclick="saveGallery()">Lưu bộ ảnh</button>
        </div>
    </div>

    <script>
        // ... (Cấu hình Firebase của cô) ...
        const db = firebase.database();

        // 1. Hàm lưu ảnh
        function saveGallery() {
            const inputVal = document.getElementById('admin-gallery-urls').value;
            const urls = inputVal.split(',').map(s => s.trim()).filter(s => s.length > 0);
            db.ref('app_data/gallery').set(urls)
              .then(() => alert("Đã cập nhật bộ ảnh thành công!"))
              .catch((e) => alert("Lỗi: " + e.message));
        }

        // 2. Hàm load ảnh khi khởi động
        function initFirebaseListener() {
            db.ref('app_data').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && data.gallery) {
                    const container = document.getElementById('gallery-container');
                    if (container) {
                        container.innerHTML = data.gallery.map(url => 
                            `<img src="${url}" class="gallery-img">`
                        ).join('');
                    }
                    document.getElementById('admin-gallery-urls').value = data.gallery.join(', ');
                }
            });
        }
        
        // [CÁC HÀM CŨ CỦA CÔ GIỮ NGUYÊN Ở ĐÂY]
        initFirebaseListener();
    </script>
</body>
</html>
